services:
  - type: web
    name: trex-api-staging
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @trex/api
    startCommand: npm run start:render -w @trex/api
    healthCheckPath: /v1/health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: staging
      - key: CORS_ORIGIN
        value: https://www.trextea.com.tr,https://trex-admin.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SHIPPING_PROVIDER
        value: mock
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: trex-media
      - key: R2_PUBLIC_BASE_URL
        sync: false
  - type: web
    name: trex-storefront
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @trex/web
    startCommand: npm run start -w @trex/web
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
  - type: web
    name: trex-admin
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @trex/admin
    startCommand: npm run start -w @trex/admin
    healthCheckPath: /giris
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://trex-api-staging.onrender.com/v1
